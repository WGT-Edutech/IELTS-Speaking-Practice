<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>IELTS Speaking Practice · Depth Gallery</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #060a14; --cyan: #22d3ee; --purple: #a78bfa; --gold: #fbbf24;
  --green: #34d399; --text: #e2e8f0; --text-dim: #b0bec5;
}
body.light { --bg: #f5f5f7; --text: #1a1a2e; --text-dim: #4a5568; --cyan: #0891b2; --purple: #7c3aed; --gold: #b45309; --green: #059669; }
.theme-toggle { position: fixed; top: 1rem; right: 1rem; z-index: 60; width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(255,255,255,.2); background: rgba(18,20,26,.55); color: var(--text); cursor: pointer; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
body.light .theme-toggle { background: rgba(255,255,255,.7); border-color: rgba(0,0,0,.15); }
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--bg); color: var(--text);
  font-family: 'Inter', sans-serif;
  font-size: clamp(1.05rem, 1.5vw, 1.3rem);
  line-height: 1.75;
  min-height: 100vh;
  padding: 0 5vw 4em;
}
.site-header { position: fixed; top: 0; left: 0; right: 0; z-index: 50; text-align: center; padding: 1.2em 4vw 0; pointer-events: none; }
/* ═══ DOTFIELD BACKGROUND (React Bits DotField, vanilla port) ═══ */
#dotfield { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }
#dotfield canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
#dotfield svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
/* ═══ VARIABLE PROXIMITY BACKGROUND (React Bits VariableProximity, vanilla port) ═══ */
#varprox { position: fixed; top: 0; left: 0; right: 0; height: 25vh; z-index: 3; display: flex; align-items: center; justify-content: center; pointer-events: none; overflow: hidden; }
#varprox .variable-proximity {
  font-family: 'Roboto Flex', sans-serif;
  font-size: clamp(1.6rem, 7vw, 8.5rem);
  white-space: nowrap;
  font-weight: 400;
  letter-spacing: .02em;
  line-height: 1.2;
  text-align: center;
  color: #d6e9ff;
  user-select: none;
  -webkit-user-select: none;
}
#gallery { position: fixed; inset: 0; z-index: 2; }
/* ═══ CIRCULAR CAROUSEL (React Bits CircularCarousel, cylinder preset -> vanilla) ═══ */
#gallery{
  position: fixed; inset: 0; z-index: 2;
  perspective: 2400px; perspective-origin: 50% 50%;
  touch-action: pan-y; outline: none; user-select: none; -webkit-user-select: none;
  cursor: grab;
}
#gallery:active { cursor: grabbing; }
#gallery:focus-visible { outline: 2px solid rgba(255,255,255,.45); outline-offset: 4px; border-radius: 12px; }
.cc-camera { position: absolute; inset: 0; transform-style: preserve-3d; }
.cc-ring {
  position: absolute; left: 50%; top: 50%; width: 0; height: 0;
  transform-style: preserve-3d; display: flex;
}
.cc-card {
  position: absolute; left: 0; top: 0; width: 0; height: 0;
  transform-style: preserve-3d; text-decoration: none; color: inherit;
}
.cc-tiles { position: absolute; left: 0; top: 0; transform-style: preserve-3d; }
.cc-tile {
  position: absolute; overflow: hidden;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
}
.cc-tile img { position: absolute; height: 100%; display: block; pointer-events: none; }
.cc-shade {
  position: absolute; pointer-events: none; background: #060a14;
  opacity: var(--cc-depth, 0); transform: translateZ(2px);
}
.cc-pill {
  position: absolute; left: 0; white-space: nowrap;
  font-family: 'Montserrat', sans-serif; font-weight: 700; text-transform: uppercase;
  letter-spacing: .05em; color: #fff; font-size: 1rem;
  text-shadow: 0 2px 12px rgba(0,0,0,.85); pointer-events: none;
  transform: translateX(-50%) translateZ(3px);
}
.cc-badge {
  position: absolute; background: var(--green); color: #04120b;
  font-size: .72rem; font-weight: 700; padding: 3px 9px; border-radius: 12px;
  display: none; pointer-events: none; transform: translateZ(3px);
}
.cc-card.done .cc-badge { display: block; }
.cc-arrow {
  position: absolute; top: 50%; transform: translateY(-50%); z-index: 3000;
  width: 44px; height: 44px; display: grid; place-items: center;
  border: 1px solid rgba(255,255,255,.18); border-radius: 999px;
  background: rgba(18,20,26,.55); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  color: #fff; cursor: pointer;
  transition: background-color .12s ease, color .12s ease;
}
.cc-arrow:hover { background: rgba(28,31,40,.85); color: #fff; }
.cc-arrow:active { transform: translateY(-50%) scale(.94); }
.cc-arrow:disabled, .cc-arrow:disabled:hover {
  background: rgba(18,20,26,.3); color: rgba(255,255,255,.35); cursor: default;
}
.cc-arrow--prev { left: 16px; }
.cc-arrow--next { right: 16px; }
.cc-dots {
  position: absolute; bottom: 9vh; left: 50%; transform: translateX(-50%); z-index: 3000;
  display: flex; gap: 8px; padding: 8px 12px; border-radius: 999px;
  background: rgba(14,16,22,.4); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.cc-dot {
  width: 7px; height: 7px; padding: 0; border: none; border-radius: 999px;
  background: rgba(255,255,255,.32); cursor: pointer;
  transition: width .2s ease, background-color .2s ease;
}
.cc-dot.is-active { width: 20px; background: var(--cyan); }
#card-info { position: fixed; bottom: 14vh; left: 50%; transform: translateX(-50%); z-index: 30; text-align: center; opacity: 0; transition: opacity .3s ease; pointer-events: none; }
#card-info.visible { opacity: 1; }
.card-name { font-family: 'Montserrat', sans-serif; font-size: 1.45rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--cyan); text-shadow: 0 0 12px rgba(34,211,238,.4); }

/* ═══ PREV / NEXT CONTROLS (responsive, no border animation) ═══ */
.cover-nav {
  position: fixed; bottom: 3vh; left: 50%; transform: translateX(-50%); z-index: 40;
  display: flex; align-items: center; gap: 1.4rem; padding: .7rem 1.6rem;
  background: rgba(10,14,26,.55); border: 1px solid rgba(255,255,255,.12);
  border-radius: 999px; backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
}
.cover-arrow {
  min-width: 110px; padding: .85em 1.8em; border-radius: 999px;
  background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.16);
  color: var(--text); font-size: 1.05rem; font-weight: 600; letter-spacing: .08em;
  text-transform: uppercase; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: .55em;
  transition: background-color .12s ease, color .12s ease;
}
.cover-arrow:hover { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.28); color: #fff; }
.cover-arrow:active { transform: scale(.97); }
.cover-arrow:disabled, .cover-arrow:disabled:hover {
  background: rgba(255,255,255,.03); border-color: rgba(255,255,255,.1);
  color: rgba(226,232,240,.35); cursor: default; transform: none;
}
.cover-arrow .arr { font-size: 1.2rem; line-height: 1; }
@media (max-width: 768px) {
  .cc-arrow { width: 38px; height: 38px; }
  .cc-arrow--prev { left: 8px; }
  .cc-arrow--next { right: 8px; }
  .cc-dots { bottom: 10vh; }
  .cover-nav { bottom: 2vh; gap: .8rem; padding: .55rem 1rem; }
  .cover-arrow { min-width: 88px; padding: .7em 1.3em; font-size: .95rem; }
  #card-info { bottom: 15vh; }
}

h1 {
  font-family: 'Montserrat', sans-serif; font-weight: 900;
  font-size: clamp(3rem, 7vw, 5.5rem);
  background: linear-gradient(120deg, var(--cyan) 0%, var(--purple) 40%, var(--gold) 80%, var(--cyan) 100%);
  background-size: 250% 100%;
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; text-align: center; margin-bottom: .25em;
  letter-spacing: -.02em;
  filter: drop-shadow(0 2px 18px rgba(34,211,238,.22)) drop-shadow(0 1px 2px rgba(0,0,0,.6));
  animation: titleFlow 8s ease-in-out infinite;
}
@keyframes titleFlow {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}
.subtitle {
  text-align: center; color: var(--text-dim); margin-bottom: 0;
  font-size: clamp(1.2rem, 2.5vw, 1.7rem); letter-spacing: .02em;
  text-shadow: 0 1px 2px rgba(0,0,0,.5);
}

.deck-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 1.5em;
  max-width: 1200px; margin: 0 auto;
}
.deck-card {
  background: rgba(255,255,255,0.04);
  border: 1.5px solid rgba(255,255,255,0.12);
  border-radius: 18px;
  padding: 0;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.06);
  overflow: hidden;
  transition: transform 0.15s ease, box-shadow 0.3s ease;
  text-decoration: none; color: var(--text); display: block;
}
.deck-card:hover { transform: scale(1.03); box-shadow: 0 12px 40px rgba(34,211,238,0.15); }
.deck-card:active { transform: scale(0.97); }
.deck-card .card-img {
  width: 100%; height: 160px; object-fit: cover; display: block;
}
.deck-card .card-body { padding: 1.2em 1.4em; }
.deck-card h2 {
  font-family: 'Montserrat', sans-serif; font-weight: 700;
  font-size: 1.2rem; color: var(--cyan); margin-bottom: .3em;
}
.deck-card .card-info {
  font-size: .82rem; color: var(--text-dim);
  display: flex; gap: 1em; flex-wrap: wrap;
}
.deck-card .badge {
  display: inline-block; padding: 2px 10px; border-radius: 12px;
  font-size: .72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
}
.badge-p1 { background: rgba(251,191,36,.15); color: var(--gold); }
.badge-p2 { background: rgba(34,211,238,.15); color: var(--cyan); }
.badge-p3 { background: rgba(167,139,250,.15); color: var(--purple); }
.progress-dot {
  display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  background: rgba(255,255,255,0.2); margin-right: 4px;
}
.progress-dot.done { background: var(--green); }
footer { text-align: center; color: var(--text-dim); margin-top: 3em; font-size: .95rem; }
@media (max-width: 768px) {
  body { padding: 1em 4vw 3em; }
}

/* ═══ SIDEBAR MENU (VariableProximity items -> vanilla) ═══ */
.side-menu {
  position: fixed; left: 14px; top: 50%; transform: translateY(-50%);
  z-index: 45; display: flex; flex-direction: column; gap: 3px;
  padding: 13px 10px; border-radius: 14px;
  background: rgba(10,14,26,.45); border: 1px solid rgba(34,211,238,.15);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 8px 32px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06);
}
.side-item {
  font-family: 'Roboto Flex', sans-serif; font-size: 1.07rem; font-weight: 400;
  color: rgba(226,232,240,.55); text-align: left; letter-spacing: .02em;
  background: none; border: none; padding: 7px 13px; border-radius: 8px;
  cursor: pointer; white-space: nowrap; line-height: 1.35;
  transition: color .2s ease, background .2s ease;
}
.side-item:hover { background: rgba(34,211,238,.08); }
.side-item.is-active { color: var(--cyan); }
.side-item:focus-visible { outline: 2px solid rgba(34,211,238,.6); outline-offset: 1px; }
.side-item__label span { display: inline-block; }
@media (max-width: 768px) { .side-menu { display: none; } }
</style></head>
<body>
<button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">🌙</button>
<div id="dotfield"></div>
<div id="varprox" aria-hidden="true"></div>

<section id="gallery"></section>
<div id="card-info"><div class="card-name" id="cardName"></div></div>
<div class="cover-nav">
  <button class="cover-arrow prev" id="prevBtn" aria-label="Back"><span class="arr">&larr;</span> Back</button>
  <button class="cover-arrow next" id="nextBtn" aria-label="Next">Next <span class="arr">&rarr;</span></button>
</div>
<script>
var decks = [
  { file: "deck-1-technology.html", title: "Technology & Society", img: "https://images.pexels.com/photos/29871288/pexels-photo-29871288.jpeg?auto=compress&cs=tinysrgb&dpr=2&h=650&w=940", p1: 6, p2: 1, p3: 4 },
  { file: "deck-2-environment.html", title: "Environment & Climate", img: "https://images.pexels.com/photos/37507631/pexels-photo-37507631.jpeg?auto=compress&cs=tinysrgb&dpr=2&h=650&w=940", p1: 6, p2: 1, p3: 4 },
  { file: "deck-3-education.html", title: "Education & Learning", img: "https://images.pexels.com/photos/8199602/pexels-photo-8199602.jpeg?auto=compress&cs=tinysrgb&dpr=2&h=650&w=940", p1: 6, p2: 1, p3: 4 },
  { file: "deck-4-health.html", title: "Health & Wellbeing", img: "https://images.pexels.com/photos/8381744/pexels-photo-8381744.jpeg?auto=compress&cs=tinysrgb&dpr=2&h=650&w=940", p1: 6, p2: 1, p3: 4 },
  { file: "deck-5-work.html", title: "Work & Employment", img: "https://images.pexels.com/photos/7693692/pexels-photo-7693692.jpeg?auto=compress&cs=tinysrgb&dpr=2&h=650&w=940", p1: 6, p2: 1, p3: 4 },
  { file: "deck-6-culture.html", title: "Culture & Tradition", img: "https://images.pexels.com/photos/38800651/pexels-photo-38800651.jpeg?auto=compress&cs=tinysrgb&dpr=2&h=650&w=940", p1: 6, p2: 1, p3: 4 },
  { file: "deck-7-globalization.html", title: "Globalization", img: "https://images.pexels.com/photos/9331326/pexels-photo-9331326.jpeg?auto=compress&cs=tinysrgb&dpr=2&h=650&w=940", p1: 6, p2: 1, p3: 4 },
  { file: "deck-8-media.html", title: "Media & Communication", img: "https://images.pexels.com/photos/32007691/pexels-photo-32007691.jpeg?auto=compress&cs=tinysrgb&dpr=2&h=650&w=940", p1: 6, p2: 1, p3: 4 },
  { file: "deck-9-science.html", title: "Science & Innovation", img: "https://images.pexels.com/photos/9243751/pexels-photo-9243751.jpeg?auto=compress&cs=tinysrgb&dpr=2&h=650&w=940", p1: 6, p2: 1, p3: 4 },
  { file: "deck-10-city.html", title: "City & Urban Life", img: "https://images.pexels.com/photos/20208915/pexels-photo-20208915.jpeg?auto=compress&cs=tinysrgb&dpr=2&h=650&w=940", p1: 6, p2: 1, p3: 4 },
  { file: "deck-11-food.html", title: "Food & Cooking", img: "https://images.pexels.com/photos/4253300/pexels-photo-4253300.jpeg?auto=compress&cs=tinysrgb&dpr=2&h=650&w=940", p1: 6, p2: 1, p3: 4 },
  { file: "deck-12-shopping.html", title: "Shopping & Consumer Habits", img: "https://images.pexels.com/photos/264502/pexels-photo-264502.jpeg?auto=compress&cs=tinysrgb&dpr=2&h=650&w=940", p1: 6, p2: 1, p3: 4 },
];

var progress = JSON.parse(localStorage.getItem('ielts-b2-progress') || '{}');

// ═══ PLEASANT SWISH SOUNDS (Web Audio, no deps) ═══
var audioCtx = null;
function ensureAudio(){
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playSwish(dir){
  try {
    ensureAudio();
    var now = audioCtx.currentTime;
    // soft filtered noise burst with rising/falling sweep = pleasant whoosh
    var dur = 0.22, sr = audioCtx.sampleRate;
    var buf = audioCtx.createBuffer(1, Math.floor(sr * dur), sr);
    var d = buf.getChannelData(0);
    for (var i = 0; i < d.length; i++) {
      d[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * i / d.length);
    }
    var src = audioCtx.createBufferSource(); src.buffer = buf;
    var f = audioCtx.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 6;
    var g = audioCtx.createGain();
    if (dir > 0) { f.frequency.setValueAtTime(500, now); f.frequency.exponentialRampToValueAtTime(2600, now + dur); }
    else { f.frequency.setValueAtTime(2600, now); f.frequency.exponentialRampToValueAtTime(500, now + dur); }
    g.gain.setValueAtTime(0, now);
    g.gain.linearRampToValueAtTime(0.08, now + 0.03);
    g.gain.exponentialRampToValueAtTime(0.001, now + dur);
    src.connect(f); f.connect(g); g.connect(audioCtx.destination);
    src.start(now); src.stop(now + dur + 0.05);
  } catch(e) {}
}

// ═══ SIDEBAR MENU (VariableProximity items -> vanilla) ═══
(function(){
  var menu = document.createElement('nav');
  menu.className = 'side-menu';
  menu.setAttribute('aria-label', 'Deck topics');
  document.body.appendChild(menu);

  var items = [];
  decks.forEach(function(d, i){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'side-item';
    b.setAttribute('aria-label', 'Jump to ' + d.title);
    var lab = document.createElement('span');
    lab.className = 'side-item__label';
    var letterEls = [];
    var words = d.title.split(' ');
    words.forEach(function(word, wi){
      var wspan = document.createElement('span');
      wspan.style.display = 'inline-block';
      wspan.style.whiteSpace = 'nowrap';
      word.split('').forEach(function(ch){
        var l = document.createElement('span');
        l.style.display = 'inline-block';
        l.textContent = ch;
        wspan.appendChild(l);
        letterEls.push(l);
      });
      lab.appendChild(wspan);
      if (wi < words.length - 1){
        var sp = document.createElement('span');
        sp.style.display = 'inline-block';
        sp.innerHTML = '&nbsp;';
        lab.appendChild(sp);
      }
    });
    b.appendChild(lab);
    b.addEventListener('click', function(){
      var cur = window.DG ? window.DG.getFocus() : -1;
      if (cur === i){ window.location.href = d.file; return; }
      if (window.DG) window.DG.focus(i);
    });
    menu.appendChild(b);
    items.push({ el: b, letterEls: letterEls, centers: null, itemCenter: null });
  });

  function cacheRects(){
    items.forEach(function(it){
      it.centers = it.letterEls.map(function(l){
        var r = l.getBoundingClientRect();
        return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
      });
      var r = it.el.getBoundingClientRect();
      it.itemCenter = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
    });
  }
  cacheRects();
  window.addEventListener('resize', cacheRects);

  // active highlight follows carousel focus
  window.__dgChange = function(idx){
    items.forEach(function(it, i){ it.el.classList.toggle('is-active', i === idx); });
  };
  window.__dgChange(0);

  // VariableProximity: per-letter weight ramp near the cursor
  var RADIUS = 120, BASE = 400, MAX = 900;
  var mouse = { x: -9999, y: -9999 };
  window.addEventListener('mousemove', function(e){ mouse.x = e.clientX; mouse.y = e.clientY; }, { passive: true });
  window.addEventListener('touchmove', function(e){ var t = e.touches[0]; if (t){ mouse.x = t.clientX; mouse.y = t.clientY; } }, { passive: true });

  var lx = null, ly = null;
  function loop(){
    requestAnimationFrame(loop);
    if (mouse.x === lx && mouse.y === ly) return;
    lx = mouse.x; ly = mouse.y;
    items.forEach(function(it){
      if (!it.centers) return;
      if (Math.hypot(mouse.x - it.itemCenter.x, mouse.y - it.itemCenter.y) > RADIUS + 80) return;
      it.letterEls.forEach(function(l, li){
        var c = it.centers[li];
        var d = Math.hypot(mouse.x - c.x, mouse.y - c.y);
        var norm = d >= RADIUS ? 0 : 1 - d / RADIUS;
        var w = BASE + (MAX - BASE) * norm;
        var o = 9 + (20 - 9) * norm;
        l.style.fontVariationSettings = "'wght' " + w.toFixed(1) + ", 'opsz' " + o.toFixed(1);
      });
    });
  }
  requestAnimationFrame(loop);
})();

// ═══ CIRCULAR CAROUSEL (React Bits CircularCarousel, cylinder preset -> vanilla) ═══
(function(){
  var gallery = document.getElementById('gallery');
  if (!gallery) return;
  gallery.setAttribute('role', 'group');
  gallery.setAttribute('aria-roledescription', 'carousel');
  gallery.setAttribute('aria-label', 'IELTS Speaking Practice decks');
  gallery.tabIndex = 0;

  var cn = document.getElementById('cardName');
  var ci = document.getElementById('card-info');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');

  var COUNT = decks.length;
  var STEP = 360 / COUNT;
  var TILT = -5 * Math.PI / 180;
  var R = 780;            // ring radius (px)
  var BEND = 780;         // tile bend radius
  var TILES = 8;
  var OVERLAP = 2.5;
  var DEPTH_FADE = 0.55;
  var cardW = 360, cardH = 240;

  var camera = document.createElement('div'); camera.className = 'cc-camera';
  var ring = document.createElement('div'); ring.className = 'cc-ring';
  camera.appendChild(ring); gallery.appendChild(camera);

  var cards = [];
  var angle = 0, target = 0, dragging = false, dragX = 0, dragAngle = 0;
  var lastDragTime = 0, lastFocus = -1, lastT = performance.now();

  function metrics(){
    var h = Math.min(window.innerHeight * 0.30, 224);
    cardW = Math.round(h * 1.5); cardH = Math.round(h);
  }

  function buildTiles(card, d){
    var length = cardW / TILES, t, start, end, center, alpha, shift, depth, turn;
    for (var pass = 0; pass < 2; pass++){
      var back = pass === 1;
      for (t = 0; t < TILES; t++){
        start = t * length - (t > 0 ? OVERLAP / 2 : 0);
        end = (t + 1) * length + (t < TILES - 1 ? OVERLAP / 2 : 0);
        center = (start + end) / 2 - cardW / 2;
        alpha = center / BEND;
        shift = BEND * Math.sin(alpha);
        depth = -BEND * (1 - Math.cos(alpha));
        turn = alpha * 180 / Math.PI;
        var tile = document.createElement('div');
        tile.className = 'cc-tile';
        tile.style.width = (end - start).toFixed(2) + 'px';
        tile.style.height = cardH + 'px';
        tile.style.left = start.toFixed(2) + 'px';
        tile.style.top = (-cardH / 2).toFixed(2) + 'px';
        tile.style.transform = 'translate3d(' + shift.toFixed(2) + 'px,0,' + depth.toFixed(2) + 'px) rotateY(' + (turn + (back ? 180 : 0)).toFixed(3) + 'deg)';
        var img = document.createElement('img');
        img.src = d.img; img.alt = ''; img.draggable = false;
        img.style.left = (back ? -(cardW - end) : -start).toFixed(2) + 'px';
        img.style.width = cardW + 'px';
        tile.appendChild(img);
        card.tiles.appendChild(tile);
      }
    }
  }

  function build(){
    ring.innerHTML = '';
    cards = [];
    decks.forEach(function(d, i){
      var el = document.createElement('a');
      el.className = 'cc-card';
      el.href = d.file;
      el.setAttribute('aria-label', d.title);
      if (progress[d.file] && progress[d.file].completed) el.classList.add('done');
      var tiles = document.createElement('div'); tiles.className = 'cc-tiles';
      el.appendChild(tiles);
      var shade = document.createElement('div'); shade.className = 'cc-shade';
      shade.style.left = (-cardW / 2) + 'px';
      shade.style.top = (-cardH / 2) + 'px';
      shade.style.width = cardW + 'px';
      shade.style.height = cardH + 'px';
      el.appendChild(shade);
      var pill = document.createElement('div'); pill.className = 'cc-pill';
      pill.textContent = d.title;
      pill.style.top = (cardH / 2 + 12) + 'px';
      el.appendChild(pill);
      var badge = document.createElement('div'); badge.className = 'cc-badge';
      badge.textContent = '✓ Done';
      badge.style.top = (-cardH / 2 + 10) + 'px';
      badge.style.right = (-cardW / 2 + 10) + 'px';
      el.appendChild(badge);
      el.addEventListener('click', function(e){
        if (Date.now() - lastDragTime < 250){ e.preventDefault(); return; }
        if (i !== focusIndex()){ e.preventDefault(); goTo(i); }
      });
      el.addEventListener('mouseenter', function(){ cn.textContent = d.title; ci.classList.add('visible'); });
      el.addEventListener('mouseleave', function(){ cn.textContent = decks[focusIndex()].title; });
      ring.appendChild(el);
      cards.push({ el: el, tiles: tiles, shade: shade });
      buildTiles(cards[i], d);
      cards[i].el.style.transform = 'rotateY(' + (i * STEP) + 'deg) translateZ(' + R + 'px)';
    });
  }

  // arrows
  function makeArrow(dir){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'cc-arrow cc-arrow--' + dir;
    b.setAttribute('aria-label', dir === 'prev' ? 'Previous deck' : 'Next deck');
    b.innerHTML = dir === 'prev'
      ? '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
      : '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    b.addEventListener('click', function(){ goTo(focusIndex() + (dir === 'prev' ? -1 : 1)); });
    gallery.appendChild(b);
    return b;
  }
  var arrPrev = makeArrow('prev'), arrNext = makeArrow('next');

  // dots
  var dotsWrap = document.createElement('div');
  dotsWrap.className = 'cc-dots';
  dotsWrap.setAttribute('role', 'tablist');
  dotsWrap.setAttribute('aria-label', 'Slides');
  var dots = [];
  decks.forEach(function(d, i){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'cc-dot';
    b.setAttribute('aria-label', 'Go to deck ' + (i + 1));
    b.addEventListener('click', function(){ playSwish(i > focusIndex() ? 1 : -1); goTo(i); });
    dotsWrap.appendChild(b);
    dots.push(b);
  });
  gallery.appendChild(dotsWrap);

  function focusIndex(){ return ((Math.round(-angle / STEP) % COUNT) + COUNT) % COUNT; }

  function notify(idx){
    if (idx === lastFocus) return;
    lastFocus = idx;
    cn.textContent = decks[idx].title;
    ci.classList.add('visible');
    prevBtn.disabled = idx <= 0;
    nextBtn.disabled = idx >= COUNT - 1;
    arrPrev.disabled = idx <= 0;
    arrNext.disabled = idx >= COUNT - 1;
    dots.forEach(function(dot, i){ dot.classList.toggle('is-active', i === idx); });
    if (window.__dgChange) window.__dgChange(idx);
  }

  function goTo(i){
    var cur = focusIndex();
    var d = i - cur;
    if (d > COUNT / 2) d -= COUNT;
    if (d < -COUNT / 2) d += COUNT;
    target = angle - d * STEP;
    notify(((Math.round(-target / STEP) % COUNT) + COUNT) % COUNT);
  }

  function render(){
    ring.style.transform = 'rotateY(' + angle.toFixed(3) + 'deg)';
    for (var i = 0; i < cards.length; i++){
      var world = (((i * STEP + angle) % 360) + 360) % 360;
      var rad = world * Math.PI / 180;
      var fade = DEPTH_FADE * Math.pow((1 - Math.cos(rad)) / 2, 1.25);
      cards[i].shade.style.setProperty('--cc-depth', fade.toFixed(3));
    }
    notify(focusIndex());
  }

  function tick(now){
    requestAnimationFrame(tick);
    var dt = Math.min((now - lastT) / 1000, 0.05); lastT = now;
    if (!dragging){
      var diff = target - angle;
      angle += diff * (1 - Math.exp(-dt * 9));
      if (Math.abs(diff) < 0.02) angle = target;
    }
    render();
  }

  // drag with momentum
  var vel = 0, prevAngle = 0, prevT = 0;
  gallery.addEventListener('pointerdown', function(e){
    if (COUNT < 2) return;
    dragging = true; dragX = e.clientX; dragAngle = angle; vel = 0;
    prevAngle = angle; prevT = performance.now();
    try { gallery.setPointerCapture(e.pointerId); } catch (err) {}
  });
  gallery.addEventListener('pointermove', function(e){
    if (!dragging) return;
    var dx = e.clientX - dragX;
    if (Math.abs(dx) > 4) lastDragTime = Date.now();
    angle = dragAngle - dx * (STEP / cardW);
    var now = performance.now();
    var dt = Math.max((now - prevT) / 1000, 0.001);
    vel = (angle - prevAngle) / dt;
    prevAngle = angle; prevT = now;
    render();
  });
  function endDrag(){
    if (!dragging) return;
    dragging = false;
    lastDragTime = Date.now();
    var projected = angle + vel * 0.16;
    target = -Math.round(-projected / STEP) * STEP;
    notify(((Math.round(-target / STEP) % COUNT) + COUNT) % COUNT);
  }
  gallery.addEventListener('pointerup', endDrag);
  gallery.addEventListener('pointercancel', endDrag);

  // wheel
  gallery.addEventListener('wheel', function(e){
    e.preventDefault();
    goTo(focusIndex() + (e.deltaY > 0 || e.deltaX > 0 ? 1 : -1));
  }, { passive: false });

  document.addEventListener('keydown', function(e){
    if (e.key === 'ArrowLeft') goTo(focusIndex() - 1);
    else if (e.key === 'ArrowRight') goTo(focusIndex() + 1);
  });

  prevBtn.addEventListener('click', function(){ goTo(focusIndex() - 1); });
  nextBtn.addEventListener('click', function(){ goTo(focusIndex() + 1); });

  var rszT = null;
  window.addEventListener('resize', function(){
    clearTimeout(rszT);
    rszT = setTimeout(function(){ metrics(); build(); render(); }, 160);
  });

  camera.style.transform = 'translateZ(' + (-R) + 'px) rotateX(' + TILT + 'rad)';
  metrics();
  build();
  render();
  requestAnimationFrame(tick);

  window.DG = { focus: goTo, getFocus: focusIndex };
})();


// ═══ DOTFIELD BACKGROUND (React Bits DotField -> vanilla JS) ═══
(function(){
  var ctn = document.getElementById('dotfield');
  if (!ctn) return;
  var TWO_PI = Math.PI * 2;
  var dotRadius = 3, dotSpacing = 14, cursorRadius = 500, cursorForce = 0.1;
  var bulgeOnly = true, bulgeStrength = 67, glowRadius = 160, sparkle = false, waveAmplitude = 0;
  var gradientFrom = 'rgba(34,211,238,.30)';
  var gradientTo = 'rgba(167,139,250,.22)';
  var glowColor = '#0d1220';

  var canvas = document.createElement('canvas');
  ctn.appendChild(canvas);
  var ctx = canvas.getContext('2d', { alpha: true });
  var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  var defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
  var gid = 'dotfield-glow-' + Math.random().toString(36).slice(2, 9);
  var rg = document.createElementNS('http://www.w3.org/2000/svg', 'radialGradient');
  rg.setAttribute('id', gid);
  var stop0 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
  stop0.setAttribute('offset', '0%'); stop0.setAttribute('stop-color', glowColor);
  var stop1 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
  stop1.setAttribute('offset', '100%'); stop1.setAttribute('stop-color', 'transparent');
  rg.appendChild(stop0); rg.appendChild(stop1); defs.appendChild(rg); svg.appendChild(defs);
  var glow = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  glow.setAttribute('cx', '-9999'); glow.setAttribute('cy', '-9999');
  glow.setAttribute('r', glowRadius); glow.setAttribute('fill', 'url(#' + gid + ')');
  glow.style.opacity = '0'; glow.style.willChange = 'opacity';
  svg.appendChild(glow); ctn.appendChild(svg);

  var dots = [];
  var mouse = { x: -9999, y: -9999, prevX: -9999, prevY: -9999, speed: 0 };
  var size = { w: 0, h: 0 };
  var glowOpacity = 0, engagement = 0;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);

  function buildDots(w, h){
    var step = dotRadius + dotSpacing;
    var cols = Math.floor(w / step), rows = Math.floor(h / step);
    var padX = (w % step) / 2, padY = (h % step) / 2;
    var arr = new Array(rows * cols), idx = 0;
    for (var row = 0; row < rows; row++) {
      for (var col = 0; col < cols; col++) {
        var ax = padX + col * step + step / 2;
        var ay = padY + row * step + step / 2;
        arr[idx++] = { ax: ax, ay: ay, sx: ax, sy: ay, vx: 0, vy: 0, x: ax, y: ay };
      }
    }
    dots = arr;
  }

  function doResize(){
    var rect = ctn.getBoundingClientRect();
    var w = rect.width, h = rect.height;
    canvas.width = w * dpr; canvas.height = h * dpr;
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    size.w = w; size.h = h;
    buildDots(w, h);
  }
  var resizeTimer = null;
  function onResize(){ clearTimeout(resizeTimer); resizeTimer = setTimeout(doResize, 100); }
  doResize();
  window.addEventListener('resize', onResize);

  function onMouseMove(e){
    mouse.x = e.clientX; mouse.y = e.clientY;
  }
  window.addEventListener('mousemove', onMouseMove, { passive: true });

  function updateMouseSpeed(){
    var dx = mouse.prevX - mouse.x, dy = mouse.prevY - mouse.y;
    var dist = Math.sqrt(dx * dx + dy * dy);
    mouse.speed += (dist - mouse.speed) * 0.5;
    if (mouse.speed < 0.001) mouse.speed = 0;
    mouse.prevX = mouse.x; mouse.prevY = mouse.y;
  }
  var speedInterval = setInterval(updateMouseSpeed, 20);

  var frameCount = 0;

  function tick(){
    frameCount++;
    var len = dots.length;
    var t = frameCount * 0.02;
    var targetEng = Math.min(mouse.speed / 5, 1);
    engagement += (targetEng - engagement) * 0.06;
    if (engagement < 0.001) engagement = 0;
    var eng = engagement;
    glowOpacity += (eng - glowOpacity) * 0.08;

    glow.setAttribute('cx', mouse.x);
    glow.setAttribute('cy', mouse.y);
    glow.style.opacity = glowOpacity;

    ctx.clearRect(0, 0, size.w, size.h);
    var grad = ctx.createLinearGradient(0, 0, size.w, size.h);
    grad.addColorStop(0, gradientFrom);
    grad.addColorStop(1, gradientTo);
    ctx.fillStyle = grad;

    var cr = cursorRadius, crSq = cr * cr, rad = dotRadius / 2;
    ctx.beginPath();

    for (var i = 0; i < len; i++) {
      var d = dots[i];
      var dx = mouse.x - d.ax, dy = mouse.y - d.ay;
      var distSq = dx * dx + dy * dy;

      if (distSq < crSq && eng > 0.01) {
        var dist = Math.sqrt(distSq);
        if (bulgeOnly) {
          var bt = 1 - dist / cr;
          var push = bt * bt * bulgeStrength * eng;
          var angle = Math.atan2(dy, dx);
          d.sx += (d.ax - Math.cos(angle) * push - d.sx) * 0.15;
          d.sy += (d.ay - Math.sin(angle) * push - d.sy) * 0.15;
        } else {
          var angle2 = Math.atan2(dy, dx);
          var move = (500 / dist) * (mouse.speed * cursorForce);
          d.vx += Math.cos(angle2) * -move;
          d.vy += Math.sin(angle2) * -move;
        }
      } else if (bulgeOnly) {
        d.sx += (d.ax - d.sx) * 0.1;
        d.sy += (d.ay - d.sy) * 0.1;
      }

      if (!bulgeOnly) {
        d.vx *= 0.9; d.vy *= 0.9;
        d.x = d.ax + d.vx; d.y = d.ay + d.vy;
        d.sx += (d.x - d.sx) * 0.1;
        d.sy += (d.y - d.sy) * 0.1;
      }

      var drawX = d.sx, drawY = d.sy;
      if (waveAmplitude > 0) {
        drawY += Math.sin(d.ax * 0.03 + t) * waveAmplitude;
        drawX += Math.cos(d.ay * 0.03 + t * 0.7) * waveAmplitude * 0.5;
      }

      if (sparkle) {
        var hash = ((i * 2654435761) ^ (frameCount >> 3)) >>> 0;
        if ((hash % 100) < 3) {
          ctx.moveTo(drawX + rad * 1.8, drawY);
          ctx.arc(drawX, drawY, rad * 1.8, 0, TWO_PI);
        } else {
          ctx.moveTo(drawX + rad, drawY);
          ctx.arc(drawX, drawY, rad, 0, TWO_PI);
        }
      } else {
        ctx.moveTo(drawX + rad, drawY);
        ctx.arc(drawX, drawY, rad, 0, TWO_PI);
      }
    }

    ctx.fill();
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();

// ═══ VARIABLE PROXIMITY BACKGROUND (React Bits VariableProximity -> vanilla JS) ═══
(function(){
  var ctn = document.getElementById('varprox');
  if (!ctn) return;

  // props (see React Bits VariableProximity props table)
  var label = 'IELTS Speaking Practice';
  var fromFontVariationSettings = "'wght' 400, 'opsz' 9";
  var toFontVariationSettings = "'wght' 1000, 'opsz' 40";
  var radius = 160;
  var falloff = 'linear';

  function parseSettings(str){
    var map = {};
    str.split(',').forEach(function(s){
      s = s.trim();
      var parts = s.split(' ');
      map[parts[0].replace(/['"]/g, '')] = parseFloat(parts[1]);
    });
    return map;
  }
  var fromMap = parseSettings(fromFontVariationSettings);
  var toMap = parseSettings(toFontVariationSettings);
  var axes = Object.keys(fromMap).map(function(axis){
    return { axis: axis, fromValue: fromMap[axis], toValue: toMap[axis] !== undefined ? toMap[axis] : fromMap[axis] };
  });

  // ── render label as per-letter spans (faithful to component markup) ──
  var letterEls = [];
  var letterIndex = 0;
  var rootSpan = document.createElement('span');
  rootSpan.className = 'variable-proximity';
  ctn.appendChild(rootSpan);
  label.split(' ').forEach(function(word, wordIndex){
    var wspan = document.createElement('span');
    wspan.style.display = 'inline-block';
    wspan.style.whiteSpace = 'nowrap';
    word.split('').forEach(function(ch){
      var l = document.createElement('span');
      l.style.display = 'inline-block';
      l.setAttribute('aria-hidden', 'true');
      l.textContent = ch;
      wspan.appendChild(l);
      letterEls[letterIndex++] = l;
    });
    rootSpan.appendChild(wspan);
    if (wordIndex < label.split(' ').length - 1) {
      var sp = document.createElement('span');
      sp.style.display = 'inline-block';
      sp.innerHTML = '&nbsp;';
      rootSpan.appendChild(sp);
    }
  });

  var mouseRef = { x: 0, y: 0 };
  var lastPositionRef = { x: null, y: null };
  var rectCache = null;

  function updateRect(){
    rectCache = ctn.getBoundingClientRect();
    letterRects = letterEls.map(function(l){
      var r = l.getBoundingClientRect();
      return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
    });
  }
  var letterRects = null;
  updateRect();
  window.addEventListener('resize', updateRect);

  window.addEventListener('mousemove', function(ev){
    mouseRef.x = ev.clientX; mouseRef.y = ev.clientY;
  }, { passive: true });
  window.addEventListener('touchmove', function(ev){
    var touch = ev.touches[0];
    if (touch) { mouseRef.x = touch.clientX; mouseRef.y = touch.clientY; }
  }, { passive: true });

  function calculateDistance(x1, y1, x2, y2){ return Math.sqrt((x2 - x1) * (x2 - x1) + (y2 - y1) * (y2 - y1)); }

  function calculateFalloff(distance){
    var norm = Math.min(Math.max(1 - distance / radius, 0), 1);
    switch (falloff) {
      case 'exponential': return norm * norm;
      case 'gaussian': return Math.exp(-Math.pow(distance / (radius / 2), 2) / 2);
      case 'linear':
      default: return norm;
    }
  }

  function loop(){
    requestAnimationFrame(loop);
    if (!ctn) return;
    var x = mouseRef.x, y = mouseRef.y;
    if (lastPositionRef.x === x && lastPositionRef.y === y) return;
    lastPositionRef.x = x; lastPositionRef.y = y;
    if (!rectCache) return;

    if (!letterRects) return;
    letterEls.forEach(function(letterEl, li){
      if (!letterEl) return;
      var c = letterRects[li];
      var distance = calculateDistance(x, y, c.x, c.y);

      if (distance >= radius) {
        letterEl.style.fontVariationSettings = fromFontVariationSettings;
        return;
      }

      var falloffValue = calculateFalloff(distance);
      letterEl.style.fontVariationSettings = axes.map(function(a){
        var interpolatedValue = a.fromValue + (a.toValue - a.fromValue) * falloffValue;
        return "'" + a.axis + "' " + interpolatedValue;
      }).join(', ');
    });
  }
  requestAnimationFrame(loop);
})();
