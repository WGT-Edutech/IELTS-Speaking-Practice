<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>IELTS Speaking Practice · Depth Gallery</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #060a14; --cyan: #22d3ee; --purple: #a78bfa; --gold: #fbbf24;
  --green: #34d399; --text: #e2e8f0; --text-dim: #b0bec5;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--bg); color: var(--text);
  font-family: 'Inter', sans-serif;
  font-size: clamp(1.05rem, 1.5vw, 1.3rem);
  line-height: 1.75;
  min-height: 100vh;
  padding: 0 5vw 4em;
}
.site-header { position: fixed; top: 0; left: 0; right: 0; z-index: 50; text-align: center; padding: 1.2em 4vw 0; pointer-events: none; }
/* ═══ DOTFIELD BACKGROUND (React Bits DotField, vanilla port) ═══ */
#dotfield { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }
#dotfield canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
#dotfield svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
/* ═══ VARIABLE PROXIMITY BACKGROUND (React Bits VariableProximity, vanilla port) ═══ */
#varprox { position: fixed; top: 0; left: 0; right: 0; height: 25vh; z-index: 3; display: flex; align-items: center; justify-content: center; pointer-events: none; overflow: hidden; }
#varprox .variable-proximity {
  font-family: 'Roboto Flex', sans-serif;
  font-size: clamp(1.6rem, 7vw, 8.5rem);
  white-space: nowrap;
  font-weight: 400;
  letter-spacing: .02em;
  line-height: 1.2;
  text-align: center;
  color: #d6e9ff;
  user-select: none;
  -webkit-user-select: none;
}
#gallery { position: fixed; inset: 0; z-index: 2; }
/* ═══ DEPTH CAROUSEL (React Bits DepthCarousel -> vanilla JS, GSAP-free) ═══ */
.depth-carousel {
  position: relative; width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  perspective: 1400px; perspective-origin: 50% 50%;
  touch-action: pan-y; outline: none; user-select: none; -webkit-user-select: none; cursor: grab;
}
.depth-carousel:active { cursor: grabbing; }
.depth-carousel:focus-visible { outline: 2px solid rgba(255,255,255,.5); outline-offset: 4px; border-radius: 12px; }
.depth-carousel__stage { position: absolute; inset: 0; transform-style: preserve-3d; }
.depth-carousel__card {
  position: absolute; top: 50%; left: 50%; transform-origin: center center;
  overflow: hidden; background: #0b0d12;
  border: 1px solid rgba(255,255,255,.15);
  box-shadow: 0 30px 60px -20px rgba(0,0,0,.65), 0 8px 20px -10px rgba(0,0,0,.5);
  will-change: transform, opacity, filter; cursor: pointer;
  -webkit-box-reflect: below 10px linear-gradient(to bottom, rgba(0,0,0,.45) 0%, rgba(0,0,0,0) 35%);
}
.depth-carousel__img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; -webkit-user-drag: none; }
.depth-carousel__tint { position: absolute; inset: 0; opacity: 0; pointer-events: none; mix-blend-mode: multiply; }
.done-badge {
  position: absolute; top: 10px; right: 10px; z-index: 2;
  background: var(--green); color: #04120b; font-size: .85rem; font-weight: 700;
  padding: 3px 10px; border-radius: 12px; letter-spacing: .04em; display: none;
}
.depth-carousel__card.done .done-badge { display: block; }
.depth-carousel__arrow {
  position: absolute; top: 50%; transform: translateY(-50%); z-index: 3000;
  width: 44px; height: 44px; display: grid; place-items: center;
  border: 1px solid rgba(255,255,255,.18); border-radius: 999px;
  background: rgba(18,20,26,.55); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  color: #fff; cursor: pointer;
  transition: background .2s ease, border-color .2s ease, transform .2s ease, opacity .2s ease;
}
.depth-carousel__arrow:hover { background: rgba(28,31,40,.85); border-color: rgba(255,255,255,.4); }
.depth-carousel__arrow:active { transform: translateY(-50%) scale(.94); }
.depth-carousel__arrow:disabled, .depth-carousel__arrow:disabled:hover {
  background: rgba(18,20,26,.3); border-color: rgba(255,255,255,.1); color: rgba(255,255,255,.35);
  cursor: default; opacity: .45;
}
.depth-carousel__arrow--prev { left: 16px; }
.depth-carousel__arrow--next { right: 16px; }
.depth-carousel__dots {
  position: absolute; bottom: 9vh; left: 50%; transform: translateX(-50%); z-index: 3000;
  display: flex; gap: 8px; padding: 8px 12px; border-radius: 999px;
  background: rgba(14,16,22,.4); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.depth-carousel__dot { width: 7px; height: 7px; padding: 0; border: none; border-radius: 999px; background: rgba(255,255,255,.32); cursor: pointer; transition: width .25s ease, background .25s ease; }
.depth-carousel__dot.is-active { width: 20px; background: var(--cyan); }
#card-info { position: fixed; bottom: 14vh; left: 50%; transform: translateX(-50%); z-index: 30; text-align: center; opacity: 0; transition: opacity .4s; pointer-events: none; }
#card-info.visible { opacity: 1; }
.card-name { font-family: 'Montserrat', sans-serif; font-size: 1.45rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--cyan); text-shadow: 0 0 12px rgba(34,211,238,.4); }
/* gallery arrows */
.cover-nav { position: fixed; bottom: 3vh; left: 50%; transform: translateX(-50%); z-index: 40; display: flex; align-items: center; gap: 1.4rem; padding: .7rem 1.6rem; background: rgba(10,14,26,.55); border: 1px solid rgba(34,211,238,.25); border-radius: 999px; backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); box-shadow: 0 8px 32px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08); }
.cover-arrow { width: auto; min-width: 110px; padding: .85em 1.8em; border-radius: 999px; background: linear-gradient(135deg, rgba(34,211,238,.14), rgba(167,139,250,.14)); border: 1px solid rgba(34,211,238,.4); color: var(--text); font-size: 1.05rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; transition: all .25s cubic-bezier(.25,.46,.45,.94); display: inline-flex; align-items: center; justify-content: center; gap: .55em; box-shadow: 0 0 0 rgba(34,211,238,0), inset 0 1px 0 rgba(255,255,255,.1); }
.cover-arrow .arr { font-size: 1.2rem; line-height: 1; }
.cover-arrow:hover { background: linear-gradient(135deg, rgba(34,211,238,.28), rgba(167,139,250,.28)); border-color: rgba(34,211,238,.75); color: #fff; box-shadow: 0 0 24px rgba(34,211,238,.35), 0 6px 24px rgba(0,0,0,.35); transform: translateY(-3px); }
.cover-arrow:active { transform: translateY(-1px) scale(.97); box-shadow: 0 0 12px rgba(34,211,238,.2); }
.cover-arrow.next { background: linear-gradient(135deg, rgba(34,211,238,.22), rgba(167,139,250,.22)); }
.cover-arrow:disabled, .cover-arrow:disabled:hover {
  background: linear-gradient(135deg, rgba(34,211,238,.08), rgba(167,139,250,.08));
  border-color: rgba(255,255,255,.15); color: rgba(226,232,240,.35);
  box-shadow: none; transform: none; cursor: default;
}
@media (max-width: 768px) {
  .depth-carousel__arrow { width: 38px; height: 38px; }
  .depth-carousel__arrow--prev { left: 8px; }
  .depth-carousel__arrow--next { right: 8px; }
  .depth-carousel__dots { bottom: 10vh; }
  .cover-nav { bottom: 2vh; gap: .8rem; padding: .55rem 1rem; }
  .cover-arrow { min-width: 88px; padding: .7em 1.3em; font-size: .95rem; }
  #card-info { bottom: 15vh; }
}
h1 {
  font-family: 'Montserrat', sans-serif; font-weight: 900;
  font-size: clamp(3rem, 7vw, 5.5rem);
  background: linear-gradient(120deg, var(--cyan) 0%, var(--purple) 40%, var(--gold) 80%, var(--cyan) 100%);
  background-size: 250% 100%;
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; text-align: center; margin-bottom: .25em;
  letter-spacing: -.02em;
  filter: drop-shadow(0 2px 18px rgba(34,211,238,.22)) drop-shadow(0 1px 2px rgba(0,0,0,.6));
  animation: titleFlow 8s ease-in-out infinite;
}
@keyframes titleFlow {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}
.subtitle {
  text-align: center; color: var(--text-dim); margin-bottom: 0;
  font-size: clamp(1.2rem, 2.5vw, 1.7rem); letter-spacing: .02em;
  text-shadow: 0 1px 2px rgba(0,0,0,.5);
}

.deck-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 1.5em;
  max-width: 1200px; margin: 0 auto;
}
.deck-card {
  background: rgba(255,255,255,0.04);
  border: 1.5px solid rgba(255,255,255,0.12);
  border-radius: 18px;
  padding: 0;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.06);
  overflow: hidden;
  transition: transform 0.15s ease, box-shadow 0.3s ease;
  text-decoration: none; color: var(--text); display: block;
}
.deck-card:hover { transform: scale(1.03); box-shadow: 0 12px 40px rgba(34,211,238,0.15); }
.deck-card:active { transform: scale(0.97); }
.deck-card .card-img {
  width: 100%; height: 160px; object-fit: cover; display: block;
}
.deck-card .card-body { padding: 1.2em 1.4em; }
.deck-card h2 {
  font-family: 'Montserrat', sans-serif; font-weight: 700;
  font-size: 1.2rem; color: var(--cyan); margin-bottom: .3em;
}
.deck-card .card-info {
  font-size: .82rem; color: var(--text-dim);
  display: flex; gap: 1em; flex-wrap: wrap;
}
.deck-card .badge {
  display: inline-block; padding: 2px 10px; border-radius: 12px;
  font-size: .72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
}
.badge-p1 { background: rgba(251,191,36,.15); color: var(--gold); }
.badge-p2 { background: rgba(34,211,238,.15); color: var(--cyan); }
.badge-p3 { background: rgba(167,139,250,.15); color: var(--purple); }
.progress-dot {
  display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  background: rgba(255,255,255,0.2); margin-right: 4px;
}
.progress-dot.done { background: var(--green); }
footer { text-align: center; color: var(--text-dim); margin-top: 3em; font-size: .95rem; }
@media (max-width: 768px) {
  body { padding: 1em 4vw 3em; }
}

/* ═══ SPECULAR BUTTON (React Bits SpecularButton, vanilla WebGL2 + CSS fallback) ═══ */
.specular-fx { position: relative; }
.specular-button__fx { position: absolute; inset: -20px; pointer-events: none; z-index: 1; }
.specular-button__fx canvas { display: block; width: 100%; height: 100%; }
.specular-button__label { position: relative; z-index: 2; display: inline-flex; align-items: center; justify-content: center; gap: .55em; }
/* non-WebGL fallback: rotating conic edge shine */
.specular-fallback::after {
  content: '';
  position: absolute;
  inset: -2px;
  border-radius: inherit;
  padding: 2px;
  background: conic-gradient(from var(--sb-angle, 0deg),
    transparent 0deg,
    var(--cyan) 60deg,
    #ffffff 90deg,
    var(--cyan) 120deg,
    transparent 180deg,
    transparent 360deg);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  mask-composite: exclude;
  animation: sb-shine 2.6s linear infinite;
  pointer-events: none;
  z-index: 3;
  opacity: .85;
}
@keyframes sb-shine { to { --sb-angle: 360deg; } }
@property --sb-angle { syntax: '<angle>'; inherits: false; initial-value: 0deg; }

/* ═══ SIDEBAR MENU (VariableProximity items -> vanilla) ═══ */
.side-menu {
  position: fixed; left: 14px; top: 50%; transform: translateY(-50%);
  z-index: 45; display: flex; flex-direction: column; gap: 2px;
  padding: 10px 8px; border-radius: 14px;
  background: rgba(10,14,26,.45); border: 1px solid rgba(34,211,238,.15);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 8px 32px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06);
}
.side-item {
  font-family: 'Roboto Flex', sans-serif; font-size: .82rem; font-weight: 400;
  color: rgba(226,232,240,.55); text-align: left; letter-spacing: .02em;
  background: none; border: none; padding: 5px 10px; border-radius: 8px;
  cursor: pointer; white-space: nowrap; line-height: 1.35;
  transition: color .2s ease, background .2s ease;
}
.side-item:hover { background: rgba(34,211,238,.08); }
.side-item.is-active { color: var(--cyan); }
.side-item:focus-visible { outline: 2px solid rgba(34,211,238,.6); outline-offset: 1px; }
.side-item__label span { display: inline-block; }
@media (max-width: 768px) { .side-menu { display: none; } }
</style></head>
<body>
<div id="dotfield"></div>
<div id="varprox" aria-hidden="true"></div>

<section id="gallery"></section>
<div id="card-info"><div class="card-name" id="cardName"></div></div>
<div class="cover-nav">
  <button class="cover-arrow prev specular-fx" id="prevBtn" aria-label="Back"><span class="specular-button__label"><span class="arr">&larr;</span> Back</span></button>
  <button class="cover-arrow next specular-fx" id="nextBtn" aria-label="Next"><span class="specular-button__label">Next <span class="arr">&rarr;</span></span></button>
</div>
<script>
var decks = [
  { file: "deck-1-technology.html", title: "Technology & Society", img: "https://images.pexels.com/photos/29871288/pexels-photo-29871288.jpeg?auto=compress&cs=tinysrgb&dpr=2&h=650&w=940", p1: 6, p2: 1, p3: 4 },
  { file: "deck-2-environment.html", title: "Environment & Climate", img: "https://images.pexels.com/photos/37507631/pexels-photo-37507631.jpeg?auto=compress&cs=tinysrgb&dpr=2&h=650&w=940", p1: 6, p2: 1, p3: 4 },
  { file: "deck-3-education.html", title: "Education & Learning", img: "https://images.pexels.com/photos/8199602/pexels-photo-8199602.jpeg?auto=compress&cs=tinysrgb&dpr=2&h=650&w=940", p1: 6, p2: 1, p3: 4 },
  { file: "deck-4-health.html", title: "Health & Wellbeing", img: "https://images.pexels.com/photos/8381744/pexels-photo-8381744.jpeg?auto=compress&cs=tinysrgb&dpr=2&h=650&w=940", p1: 6, p2: 1, p3: 4 },
  { file: "deck-5-work.html", title: "Work & Employment", img: "https://images.pexels.com/photos/7693692/pexels-photo-7693692.jpeg?auto=compress&cs=tinysrgb&dpr=2&h=650&w=940", p1: 6, p2: 1, p3: 4 },
  { file: "deck-6-culture.html", title: "Culture & Tradition", img: "https://images.pexels.com/photos/38800651/pexels-photo-38800651.jpeg?auto=compress&cs=tinysrgb&dpr=2&h=650&w=940", p1: 6, p2: 1, p3: 4 },
  { file: "deck-7-globalization.html", title: "Globalization", img: "https://images.pexels.com/photos/9331326/pexels-photo-9331326.jpeg?auto=compress&cs=tinysrgb&dpr=2&h=650&w=940", p1: 6, p2: 1, p3: 4 },
  { file: "deck-8-media.html", title: "Media & Communication", img: "https://images.pexels.com/photos/32007691/pexels-photo-32007691.jpeg?auto=compress&cs=tinysrgb&dpr=2&h=650&w=940", p1: 6, p2: 1, p3: 4 },
  { file: "deck-9-science.html", title: "Science & Innovation", img: "https://images.pexels.com/photos/9243751/pexels-photo-9243751.jpeg?auto=compress&cs=tinysrgb&dpr=2&h=650&w=940", p1: 6, p2: 1, p3: 4 },
  { file: "deck-10-city.html", title: "City & Urban Life", img: "https://images.pexels.com/photos/20208915/pexels-photo-20208915.jpeg?auto=compress&cs=tinysrgb&dpr=2&h=650&w=940", p1: 6, p2: 1, p3: 4 },
  { file: "deck-11-food.html", title: "Food & Cooking", img: "https://images.pexels.com/photos/4253300/pexels-photo-4253300.jpeg?auto=compress&cs=tinysrgb&dpr=2&h=650&w=940", p1: 6, p2: 1, p3: 4 },
  { file: "deck-12-shopping.html", title: "Shopping & Consumer Habits", img: "https://images.pexels.com/photos/264502/pexels-photo-264502.jpeg?auto=compress&cs=tinysrgb&dpr=2&h=650&w=940", p1: 6, p2: 1, p3: 4 },
];

var progress = JSON.parse(localStorage.getItem('ielts-b2-progress') || '{}');

// ═══ COVER FLOW GALLERY (scroll-driven, spring physics) ═══
// ═══ PLEASANT SWISH SOUNDS (Web Audio, no deps) ═══
var audioCtx = null;
function ensureAudio(){
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playSwish(dir){
  try {
    ensureAudio();
    var now = audioCtx.currentTime;
    // soft filtered noise burst with rising/falling sweep = pleasant whoosh
    var dur = 0.22, sr = audioCtx.sampleRate;
    var buf = audioCtx.createBuffer(1, Math.floor(sr * dur), sr);
    var d = buf.getChannelData(0);
    for (var i = 0; i < d.length; i++) {
      d[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * i / d.length);
    }
    var src = audioCtx.createBufferSource(); src.buffer = buf;
    var f = audioCtx.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 6;
    var g = audioCtx.createGain();
    if (dir > 0) { f.frequency.setValueAtTime(500, now); f.frequency.exponentialRampToValueAtTime(2600, now + dur); }
    else { f.frequency.setValueAtTime(2600, now); f.frequency.exponentialRampToValueAtTime(500, now + dur); }
    g.gain.setValueAtTime(0, now);
    g.gain.linearRampToValueAtTime(0.08, now + 0.03);
    g.gain.exponentialRampToValueAtTime(0.001, now + dur);
    src.connect(f); f.connect(g); g.connect(audioCtx.destination);
    src.start(now); src.stop(now + dur + 0.05);
  } catch(e) {}
}

// ═══ SIDEBAR MENU (VariableProximity items -> vanilla) ═══
(function(){
  var menu = document.createElement('nav');
  menu.className = 'side-menu';
  menu.setAttribute('aria-label', 'Deck topics');
  document.body.appendChild(menu);

  var items = [];
  decks.forEach(function(d, i){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'side-item';
    b.setAttribute('aria-label', 'Jump to ' + d.title);
    var lab = document.createElement('span');
    lab.className = 'side-item__label';
    var letterEls = [];
    var words = d.title.split(' ');
    words.forEach(function(word, wi){
      var wspan = document.createElement('span');
      wspan.style.display = 'inline-block';
      wspan.style.whiteSpace = 'nowrap';
      word.split('').forEach(function(ch){
        var l = document.createElement('span');
        l.style.display = 'inline-block';
        l.textContent = ch;
        wspan.appendChild(l);
        letterEls.push(l);
      });
      lab.appendChild(wspan);
      if (wi < words.length - 1){
        var sp = document.createElement('span');
        sp.style.display = 'inline-block';
        sp.innerHTML = '&nbsp;';
        lab.appendChild(sp);
      }
    });
    b.appendChild(lab);
    b.addEventListener('click', function(){
      var cur = window.DG ? window.DG.getFocus() : -1;
      if (cur === i){ window.location.href = d.file; return; }
      if (window.DG) window.DG.focus(i);
    });
    menu.appendChild(b);
    items.push({ el: b, letterEls: letterEls, centers: null, itemCenter: null });
  });

  function cacheRects(){
    items.forEach(function(it){
      it.centers = it.letterEls.map(function(l){
        var r = l.getBoundingClientRect();
        return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
      });
      var r = it.el.getBoundingClientRect();
      it.itemCenter = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
    });
  }
  cacheRects();
  window.addEventListener('resize', cacheRects);

  // active highlight follows carousel focus
  window.__dgChange = function(idx){
    items.forEach(function(it, i){ it.el.classList.toggle('is-active', i === idx); });
  };
  window.__dgChange(0);

  // VariableProximity: per-letter weight ramp near the cursor
  var RADIUS = 120, BASE = 400, MAX = 900;
  var mouse = { x: -9999, y: -9999 };
  window.addEventListener('mousemove', function(e){ mouse.x = e.clientX; mouse.y = e.clientY; }, { passive: true });
  window.addEventListener('touchmove', function(e){ var t = e.touches[0]; if (t){ mouse.x = t.clientX; mouse.y = t.clientY; } }, { passive: true });

  var lx = null, ly = null;
  function loop(){
    requestAnimationFrame(loop);
    if (mouse.x === lx && mouse.y === ly) return;
    lx = mouse.x; ly = mouse.y;
    items.forEach(function(it){
      if (!it.centers) return;
      if (Math.hypot(mouse.x - it.itemCenter.x, mouse.y - it.itemCenter.y) > RADIUS + 80) return;
      it.letterEls.forEach(function(l, li){
        var c = it.centers[li];
        var d = Math.hypot(mouse.x - c.x, mouse.y - c.y);
        var norm = d >= RADIUS ? 0 : 1 - d / RADIUS;
        var w = BASE + (MAX - BASE) * norm;
        var o = 9 + (20 - 9) * norm;
        l.style.fontVariationSettings = "'wght' " + w.toFixed(1) + ", 'opsz' " + o.toFixed(1);
      });
    });
  }
  requestAnimationFrame(loop);
})();

(function(){
  var gallery = document.getElementById('gallery');
  if (!gallery) return;
  gallery.classList.add('depth-carousel');
  gallery.setAttribute('role', 'group');
  gallery.setAttribute('aria-roledescription', 'carousel');
  gallery.setAttribute('aria-label', 'IELTS Speaking Practice decks');
  gallery.tabIndex = 0;

  var cn = document.getElementById('cardName');

    if (!d || !d.moved) return;
    lastDragTime = Date.now();
    var stepPx = Math.max(cardW * 0.55 * scaleRef, 40);

    cardW = s.w; cardH = s.h;
    cardEls.forEach(function(el){

  layout(0);

  // exposed API for the sidebar menu
  window.DG = {
    focus: function(i){
      i = clamp(Math.round(i), 0, decks.length - 1);
      if (i !== focusRef){ playSwish(i > focusRef ? 1 : -1); setFocus(i, true); }
    },
    getFocus: function(){ return focusRef; }
  };
})();

(function(){

    var dx = mouse.prevX - mouse.x, dy = mouse.prevY - mouse.y;
    var dist = Math.sqrt(dx * dx + dy * dy);

        ctx.arc(drawX, drawY, rad, 0, TWO_PI);
      }
    }

    ctx.fill();
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();

// ═══ VARIABLE PROXIMITY BACKGROUND (React Bits VariableProximity -> vanilla JS) ═══
(function(){
  var ctn = document.getElementById('varprox');
  if (!ctn) return;

  // props (see React Bits VariableProximity props table)
  var label = 'IELTS Speaking Practice';
  var fromFontVariationSettings = "'wght' 400, 'opsz' 9";
  var toFontVariationSettings = "'wght' 1000, 'opsz' 40";
  var radius = 160;
  var falloff = 'linear';

  function parseSettings(str){
    var map = {};
    str.split(',').forEach(function(s){
      s = s.trim();
      var parts = s.split(' ');
      map[parts[0].replace(/['"]/g, '')] = parseFloat(parts[1]);
    });
    return map;
  }
  var fromMap = parseSettings(fromFontVariationSettings);
  var toMap = parseSettings(toFontVariationSettings);
  var axes = Object.keys(fromMap).map(function(axis){
    return { axis: axis, fromValue: fromMap[axis], toValue: toMap[axis] !== undefined ? toMap[axis] : fromMap[axis] };
  });

  // ── render label as per-letter spans (faithful to component markup) ──
  var letterEls = [];
  var letterIndex = 0;
  var rootSpan = document.createElement('span');
  rootSpan.className = 'variable-proximity';
  ctn.appendChild(rootSpan);
  label.split(' ').forEach(function(word, wordIndex){
    var wspan = document.createElement('span');
    wspan.style.display = 'inline-block';
    wspan.style.whiteSpace = 'nowrap';
    word.split('').forEach(function(ch){
      var l = document.createElement('span');
      l.style.display = 'inline-block';
      l.setAttribute('aria-hidden', 'true');
      l.textContent = ch;
      wspan.appendChild(l);
      letterEls[letterIndex++] = l;
    });
    rootSpan.appendChild(wspan);
    if (wordIndex < label.split(' ').length - 1) {
      var sp = document.createElement('span');
      sp.style.display = 'inline-block';
      sp.innerHTML = '&nbsp;';
      rootSpan.appendChild(sp);
    }
  });

  var mouseRef = { x: 0, y: 0 };
  var lastPositionRef = { x: null, y: null };
  var rectCache = null;

  function updateRect(){ rectCache = ctn.getBoundingClientRect(); }
  updateRect();
  window.addEventListener('resize', updateRect);

  window.addEventListener('mousemove', function(ev){
    mouseRef.x = ev.clientX; mouseRef.y = ev.clientY;
  }, { passive: true });
  window.addEventListener('touchmove', function(ev){
    var touch = ev.touches[0];
    if (touch) { mouseRef.x = touch.clientX; mouseRef.y = touch.clientY; }
  }, { passive: true });

  function calculateDistance(x1, y1, x2, y2){ return Math.sqrt((x2 - x1) * (x2 - x1) + (y2 - y1) * (y2 - y1)); }

  function calculateFalloff(distance){
    var norm = Math.min(Math.max(1 - distance / radius, 0), 1);
    switch (falloff) {
      case 'exponential': return norm * norm;
      case 'gaussian': return Math.exp(-Math.pow(distance / (radius / 2), 2) / 2);
      case 'linear':
      default: return norm;
    }
  }

    requestAnimationFrame(loop);
    if (!ctn) return;
    var x = mouseRef.x, y = mouseRef.y;
    if (lastPositionRef.x === x && lastPositionRef.y === y) return;
    lastPositionRef.x = x; lastPositionRef.y = y;
    if (!rectCache) return;

    letterEls.forEach(function(letterEl){
      if (!letterEl) return;
      var rect = letterEl.getBoundingClientRect();
      var letterCenterX = rect.left + rect.width / 2 - rectCache.left;
      var letterCenterY = rect.top + rect.height / 2 - rectCache.top;

      var distance = calculateDistance(x, y, letterCenterX, letterCenterY);

        letterEl.style.fontVariationSettings = fromFontVariationSettings;

      var falloffValue = calculateFalloff(distance);
      letterEl.style.fontVariationSettings = axes.map(function(a){
        var interpolatedValue = a.fromValue + (a.toValue - a.fromValue) * falloffValue;
        return "'" + a.axis + "' " + interpolatedValue;
      }).join(', ');
    });
  }
  requestAnimationFrame(loop);
})();

    '  float line = gaussianLine(d, uThickness);',
    '  float edgeClamp = 1.0 - smoothstep(0.5 * uPx, 3.0 * uPx, abs(d));',
    '  float hi = line * rim * edgeClamp * uIntensity;',
    '  vec3 col = uBaseColor * base + uLineColor * hi;',
    '  float a = clamp(base + hi, 0.0, 1.0);',
    '  fragColor = vec4(col, a);',
    '}'
  ].join('\n');

  function hexToRgb(hex) {
    hex = (hex || '').trim().replace('#', '');
    if (hex.length === 3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
    var n = parseInt(hex, 16);
    if (isNaN(n)) return [1, 1, 1];
    return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255];
  }
  function accentRgb() {
    var accent = getComputedStyle(document.body).getPropertyValue('--cyan').trim() || '#22d3ee';
    if (accent.indexOf('#') === 0) return hexToRgb(accent);
    var m = accent.match(/[\d.]+/g);
    if (m && m.length >= 3) return [m[0]/255, m[1]/255, m[2]/255];
    return [1, 1, 1];
  }
  function dim(rgb, f) { return [rgb[0]*f, rgb[1]*f, rgb[2]*f]; }

  function initAll() {
    var buttons = document.querySelectorAll('.specular-fx');
    if (!buttons.length) return;
    var hasGL = !!window.WebGL2RenderingContext;

    Array.prototype.forEach.call(buttons, function(btn){
      var fx = document.createElement('span');
      fx.className = 'specular-button__fx';
      fx.setAttribute('aria-hidden', 'true');
      btn.appendChild(fx);

      var canvas = document.createElement('canvas');
      fx.appendChild(canvas);
      var gl = hasGL ? canvas.getContext('webgl2', { alpha: true, premultipliedAlpha: true, antialias: true }) : null;
      if (!gl) { btn.classList.add('specular-fallback'); return; }
      gl.clearColor(0, 0, 0, 0);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);

      function compile(type, src) {
        var s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        return s;
      }
      var prog = gl.createProgram();
      gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
      gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
      gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { btn.classList.add('specular-fallback'); return; }
      gl.useProgram(prog);

      var buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
      var posLoc = gl.getAttribLocation(prog, 'position');
      gl.enableVertexAttribArray(posLoc);
      gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

      var U = {};
      ['uCenter','uHalfSize','uRadius','uAngle','uPx','uLineColor','uBaseColor','uIntensity','uShineSize','uShineFade','uThickness','uBaseWidth'].forEach(function(n){
        U[n] = gl.getUniformLocation(prog, n);
      });

      var dpr = window.devicePixelRatio || 1;
      var sizeRef = { w: 1, h: 1 };
      var radius = 18;
      var lineColor = [1,1,1], baseColor = [0.32,0.32,0.32];
      lineColor = accentRgb();
      baseColor = dim(lineColor, 0.62);

      function resize() {
        var rect = btn.getBoundingClientRect();
        var w = rect.width, h = rect.height;
        if (w < 1 || h < 1) return;
        sizeRef.w = w; sizeRef.h = h;
        var cw = w + PAD * 2, ch = h + PAD * 2;
        canvas.width = Math.max(2, Math.round(cw * dpr));
        canvas.height = Math.max(2, Math.round(ch * dpr));
        canvas.style.width = cw + 'px';
        canvas.style.height = ch + 'px';
        gl.viewport(0, 0, canvas.width, canvas.height);
        gl.uniform2f(U.uCenter, (PAD + w/2) * dpr, (PAD + h/2) * dpr);
        gl.uniform2f(U.uHalfSize, (w/2) * dpr, (h/2) * dpr);
        gl.uniform1f(U.uRadius, Math.min(radius, Math.min(w, h)/2) * dpr);
      }
      var ro = new ResizeObserver(resize);
      ro.observe(btn);
      resize();

      var pointerAngle = null;
      var proximityT = 0;
      function onPointerMove(e) {
        var rect = btn.getBoundingClientRect();
        var cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
        var dx = Math.max(rect.left - e.clientX, 0, e.clientX - rect.right);
        var dy = Math.max(rect.top - e.clientY, 0, e.clientY - rect.bottom);
        var dist = Math.hypot(dx, dy);
        if (dist === 0) {
          var nx = (e.clientX - cx) / (rect.width/2);
          var ny = (cy - e.clientY) / (rect.height/2);
          pointerAngle = Math.atan2(2/rect.height, -2/rect.width) + nx*0.3 + ny*0.15;
        } else {
          pointerAngle = Math.atan2(cy - e.clientY, e.clientX - cx);
        }
        var t = Math.max(0, 1 - dist / Math.max(250, 1));
        proximityT = t * t * (3 - 2 * t);
      }
      window.addEventListener('pointermove', onPointerMove);

      var angle = 2.4, idleAngle = 2.4, bright = 0;
      var last = performance.now();

      function update(now) {
        requestAnimationFrame(update);
        var dt = Math.min((now - last) / 1000, 0.05);
        last = now;
        idleAngle += 0.35 * dt;
        var steer = pointerAngle != null && proximityT > 0.01;
        var target = steer ? pointerAngle : idleAngle;
        var diff = ((target - angle + Math.PI*3) % (Math.PI*2)) - Math.PI;
        angle += diff * (1 - Math.exp(-dt * 7));
        var brightTarget = 0.9 + proximityT * 0.1;
        bright += (brightTarget - bright) * (1 - Math.exp(-dt * 8));

        gl.uniform1f(U.uAngle, angle);
        gl.uniform1f(U.uPx, dpr);
        gl.uniform3fv(U.uLineColor, lineColor);
        gl.uniform3fv(U.uBaseColor, baseColor);
        gl.uniform1f(U.uIntensity, bright);
        gl.uniform1f(U.uShineSize, (12 * Math.PI) / 180);
        gl.uniform1f(U.uShineFade, (40 * Math.PI) / 180);
        gl.uniform1f(U.uThickness, 2.5 * dpr);
        gl.uniform1f(U.uBaseWidth, dpr);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
      }
      requestAnimationFrame(update);
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initAll);
  else initAll();
})();

</script>
</body></html>
